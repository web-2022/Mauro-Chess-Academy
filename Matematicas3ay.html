<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MathLab - Funciones Lineales</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 30px;
    }

    header h1 {
      font-size: 26px;
    }

    header p {
      margin-top: 5px;
      color: #cbd5e1;
    }

    .contenedor {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;

      max-width: 1300px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;

      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
    }

    .panel h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    .control {
      margin-bottom: 30px;
    }

    .control label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .control input[type="range"] {
      width: 100%;
    }

    .valor {
      font-size: 20px;
      font-weight: bold;
      margin-top: 8px;
      color: #2563eb;
    }

    .ecuacion {
      margin-top: 30px;

      padding: 15px;

      background: #eff6ff;
      border-left: 5px solid #2563eb;

      border-radius: 6px;

      font-size: 22px;
      text-align: center;
    }

    .grafico-panel {
      background: white;

      border-radius: 12px;

      padding: 20px;

      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
    }

    .grafico-panel h2 {
      margin-bottom: 10px;
    }

    .grafico-panel p {
      color: #64748b;
      margin-bottom: 15px;
    }

    svg {
      width: 100%;
      height: 600px;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      border-radius: 8px;
    }

    .grid-line {
      stroke: #e5e7eb;
      stroke-width: 1;
    }

    .axis {
      stroke: #111827;
      stroke-width: 2;
    }

    .function-line {
      stroke: #2563eb;
      stroke-width: 4;
      stroke-linecap: round;
    }

    .point {
      fill: #dc2626;
    }

    .axis-label {
      font-size: 14px;
      fill: #475569;
    }

    .info {
      margin-top: 20px;

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 10px;
    }

    .info-box {
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
    }

    .info-box span {
      display: block;
      font-size: 13px;
      color: #64748b;
    }

    .info-box strong {
      display: block;
      margin-top: 5px;
      font-size: 20px;
    }

    @media (max-width: 800px) {

      .contenedor {
        grid-template-columns: 1fr;
      }

      svg {
        height: 420px;
      }

      .info {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>

<header>

  <h1>MathLab</h1>

  <p>
    Laboratorio interactivo de matemáticas
  </p>

</header>


<div class="contenedor">

  <!-- PANEL DE CONTROLES -->

  <div class="panel">

    <h2>Función lineal</h2>

    <div class="control">

      <label>
        Pendiente (m)
      </label>

      <input
        type="range"
        id="sliderM"
        min="-5"
        max="5"
        step="0.1"
        value="1"
      >

      <div
        class="valor"
        id="valorM"
      >
        1
      </div>

    </div>


    <div class="control">

      <label>
        Intercepto (b)
      </label>

      <input
        type="range"
        id="sliderB"
        min="-10"
        max="10"
        step="0.5"
        value="0"
      >

      <div
        class="valor"
        id="valorB"
      >
        0
      </div>

    </div>


    <div class="ecuacion">

      <span id="ecuacion">

        y = x

      </span>

    </div>

  </div>


  <!-- PANEL DEL GRÁFICO -->

  <div class="grafico-panel">

    <h2>
      Representación gráfica
    </h2>

    <p>
      Modifica la pendiente y el intercepto.
    </p>


    <svg
      id="grafico"
      viewBox="0 0 900 600"
    >
    </svg>


    <div class="info">

      <div class="info-box">

        <span>
          Pendiente
        </span>

        <strong id="infoPendiente">
          1
        </strong>

      </div>


      <div class="info-box">

        <span>
          Intercepto en Y
        </span>

        <strong id="infoIntercepto">
          0
        </strong>

      </div>


      <div class="info-box">

        <span>
          Comportamiento
        </span>

        <strong id="infoComportamiento">
          Creciente
        </strong>

      </div>

    </div>

  </div>

</div>


<script>

  // ==============================
  // CONFIGURACIÓN DEL GRÁFICO
  // ==============================

  const svg = document.getElementById("grafico");

  const ancho = 900;
  const alto = 600;

  const centroX = ancho / 2;
  const centroY = alto / 2;

  const escala = 40;


  // ==============================
  // CONTROLES
  // ==============================

  const sliderM =
    document.getElementById("sliderM");

  const sliderB =
    document.getElementById("sliderB");


  const valorM =
    document.getElementById("valorM");

  const valorB =
    document.getElementById("valorB");


  const ecuacion =
    document.getElementById("ecuacion");


  const infoPendiente =
    document.getElementById("infoPendiente");

  const infoIntercepto =
    document.getElementById("infoIntercepto");

  const infoComportamiento =
    document.getElementById("infoComportamiento");


  // ==============================
  // CONVERTIR COORDENADAS
  // ==============================

  function convertirX(x) {

    return centroX + x * escala;

  }


  function convertirY(y) {

    return centroY - y * escala;

  }


  // ==============================
  // DIBUJAR CUADRÍCULA
  // ==============================

  function dibujarCuadricula() {

    for (
      let x = -10;
      x <= 10;
      x++
    ) {

      const linea =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      linea.setAttribute(
        "x1",
        convertirX(x)
      );

      linea.setAttribute(
        "y1",
        0
      );

      linea.setAttribute(
        "x2",
        convertirX(x)
      );

      linea.setAttribute(
        "y2",
        alto
      );

      linea.setAttribute(
        "class",
        "grid-line"
      );

      svg.appendChild(linea);

    }


    for (
      let y = -7;
      y <= 7;
      y++
    ) {

      const linea =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      linea.setAttribute(
        "x1",
        0
      );

      linea.setAttribute(
        "y1",
        convertirY(y)
      );

      linea.setAttribute(
        "x2",
        ancho
      );

      linea.setAttribute(
        "y2",
        convertirY(y)
      );

      linea.setAttribute(
        "class",
        "grid-line"
      );

      svg.appendChild(linea);

    }

  }


  // ==============================
  // DIBUJAR EJES
  // ==============================

  function dibujarEjes() {

    // Eje X

    const ejeX =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );

    ejeX.setAttribute(
      "x1",
      0
    );

    ejeX.setAttribute(
      "y1",
      centroY
    );

    ejeX.setAttribute(
      "x2",
      ancho
    );

    ejeX.setAttribute(
      "y2",
      centroY
    );

    ejeX.setAttribute(
      "class",
      "axis"
    );

    svg.appendChild(ejeX);


    // Eje Y

    const ejeY =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );

    ejeY.setAttribute(
      "x1",
      centroX
    );

    ejeY.setAttribute(
      "y1",
      0
    );

    ejeY.setAttribute(
      "x2",
      centroX
    );

    ejeY.setAttribute(
      "y2",
      alto
    );

    ejeY.setAttribute(
      "class",
      "axis"
    );

    svg.appendChild(ejeY);

  }


  // ==============================
  // DIBUJAR NÚMEROS
  // ==============================

  function dibujarNumeros() {

    for (
      let x = -10;
      x <= 10;
      x++
    ) {

      if (x === 0) continue;


      const texto =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );


      texto.setAttribute(
        "x",
        convertirX(x)
      );

      texto.setAttribute(
        "y",
        centroY + 20
      );

      texto.setAttribute(
        "text-anchor",
        "middle"
      );

      texto.setAttribute(
        "class",
        "axis-label"
      );


      texto.textContent = x;

      svg.appendChild(texto);

    }


    for (
      let y = -7;
      y <= 7;
      y++
    ) {

      if (y === 0) continue;


      const texto =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );


      texto.setAttribute(
        "x",
        centroX - 10
      );

      texto.setAttribute(
        "y",
        convertirY(y) + 5
      );

      texto.setAttribute(
        "text-anchor",
        "end"
      );

      texto.setAttribute(
        "class",
        "axis-label"
      );


      texto.textContent = y;

      svg.appendChild(texto);

    }

  }


  // ==============================
  // DIBUJAR FUNCIÓN
  // ==============================

  function dibujarFuncion() {

    const m =
      parseFloat(
        sliderM.value
      );

    const b =
      parseFloat(
        sliderB.value
      );


    // Borrar función anterior

    const anterior =
      document.getElementById(
        "lineaFuncion"
      );

    if (anterior) {

      anterior.remove();

    }


    const puntoAnterior =
      document.getElementById(
        "puntoIntercepto"
      );

    if (puntoAnterior) {

      puntoAnterior.remove();

    }


    // Valores extremos de X

    const x1 = -20;
    const x2 = 20;


    const y1 =
      m * x1 + b;

    const y2 =
      m * x2 + b;


    // Crear línea

    const linea =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );


    linea.setAttribute(
      "id",
      "lineaFuncion"
    );


    linea.setAttribute(
      "x1",
      convertirX(x1)
    );

    linea.setAttribute(
      "y1",
      convertirY(y1)
    );

    linea.setAttribute(
      "x2",
      convertirX(x2)
    );

    linea.setAttribute(
      "y2",
      convertirY(y2)
    );


    linea.setAttribute(
      "class",
      "function-line"
    );


    svg.appendChild(linea);


    // Punto de intersección con Y

    const punto =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );


    punto.setAttribute(
      "id",
      "puntoIntercepto"
    );

    punto.setAttribute(
      "cx",
      convertirX(0)
    );

    punto.setAttribute(
      "cy",
      convertirY(b)
    );

    punto.setAttribute(
      "r",
      7
    );

    punto.setAttribute(
      "class",
      "point"
    );


    svg.appendChild(punto);


    // Actualizar valores

    valorM.textContent =
      m.toFixed(1);

    valorB.textContent =
      b.toFixed(1);


    infoPendiente.textContent =
      m.toFixed(1);

    infoIntercepto.textContent =
      b.toFixed(1);


    // Comportamiento

    if (m > 0) {

      infoComportamiento.textContent =
        "Creciente";

    }

    else if (m < 0) {

      infoComportamiento.textContent =
        "Decreciente";

    }

    else {

      infoComportamiento.textContent =
        "Constante";

    }


    // Mostrar ecuación

    let texto =
      "y = ";


    if (m === 0) {

      texto += b;

    }

    else {

      if (m === 1) {

        texto += "x";

      }

      else if (m === -1) {

        texto += "-x";

      }

      else {

        texto +=
          m.toFixed(1) + "x";

      }


      if (b > 0) {

        texto +=
          " + " + b.toFixed(1);

      }

      else if (b < 0) {

        texto +=
          " - " +
          Math.abs(b).toFixed(1);

      }

    }


    ecuacion.textContent =
      texto;

  }


  // ==============================
  // EVENTOS
  // ==============================

  sliderM.addEventListener(
    "input",
    dibujarFuncion
  );


  sliderB.addEventListener(
    "input",
    dibujarFuncion
  );


  // ==============================
  // INICIALIZAR
  // ==============================

  dibujarCuadricula();

  dibujarEjes();

  dibujarNumeros();

  dibujarFuncion();

</script>

</body>
</html>
