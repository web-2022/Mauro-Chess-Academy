<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajedrez • Peón al paso</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1976d2">

    <style>
      * {
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(145deg, #dbeafe, #e0f2fe);
        padding: clamp(12px, 4vw, 18px);
      }

      .app {
        background: #fff;
        width: 100%;
        max-width: 520px;
        padding: 18px;
        border-radius: 24px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, .12);
      }

      .brand-header-kids {
        padding: 14px;
        border-radius: 22px;
        margin-bottom: 12px;
        background: linear-gradient(90deg, #22c55e, #38bdf8);
        color: #020617;
        pointer-events: none;
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .kids-badge {
        width: 52px;
        height: 52px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        font-size: 1.6rem;
        background: rgba(255, 255, 255, .25);
      }

      .kids-title {
        font-weight: 900;
        font-size: 1.35rem;
      }

      .kids-subtitle {
        margin-left: auto;
        display: flex;
        gap: 8px;
        pointer-events: auto;
      }

      .kids-pill {
        background: rgba(255, 255, 255, .25);
        padding: 4px 10px;
        border-radius: 999px;
        font-size: .8rem;
        font-weight: 700;
        cursor: pointer;
      }

      h1 {
        text-align: center;
        margin: 6px 0 2px;
        font-size: 1.2rem;
      }

      .subtitle {
        text-align: center;
        font-size: .95rem;
        color: #6b7280;
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        padding: 8px 12px;
        border-radius: 999px;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        font-size: .9rem;
        margin-bottom: 8px;
      }

      .progress {
        height: 10px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 8px;
      }

      .progress-inner {
        height: 100%;
        width: 0%;
        background: #2563eb;
        transition: .3s;
      }

      .card {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 16px;
        text-align: center;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        width: 100%;
        aspect-ratio: 1/1;
        max-width: min(360px, 90vw);
        margin: auto;
        border-radius: 18px;
        overflow: hidden;
        border: 3px solid #60a5fa;
        background: #60a5fa;
      }

      .sq {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1.6rem, 5.6vw, 2.05rem);
        font-weight: 800;
        user-select: none;
        cursor: pointer;
      }

      .light {
        background: #f8fbff;
      }

      .dark {
        background: #9ec5fe;
      }

      .path {
        background: rgba(59, 130, 246, .35) !important;
      }

      .target {
        box-shadow: inset 0 0 0 4px #22c55e;
        background: rgba(34, 197, 94, .35) !important;
      }

      .wrong {
        box-shadow: inset 0 0 0 4px #ef4444;
        background: rgba(239, 68, 68, .35) !important;
      }

      .feedback {
        margin-top: 8px;
        font-weight: 800;
        min-height: 24px;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .main-btn {
        flex: 1;
        min-width: 140px;
        max-width: 220px;
        padding: 12px;
        border-radius: 999px;
        border: none;
        font-weight: 800;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }

      .hint {
        background: rgba(37, 99, 235, .15);
        box-shadow: inset 0 0 0 3px #2563eb;
      }

      /* === BORDES DEL TABLERO (FILAS Y COLUMNAS) === */
      .board-wrap {
        width: 100%;
        max-width: min(360px, 90vw);
        margin: 0 auto;
      }

      .board-grid {
        display: grid;
        grid-template-columns: clamp(22px, 6vw, 28px) 1fr;
        grid-template-rows: 1fr clamp(22px, 6vw, 28px);
        gap: clamp(4px, 1.5vw, 6px);
      }

      .ranks {
        display: grid;
        grid-template-rows: repeat(8, 1fr);
        font-weight: 900;
        color: #334155;
        opacity: .85;
      }

      .rank {
        display: grid;
        place-items: center;
        font-size: .85rem;
        user-select: none;
      }

      .files {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        font-weight: 900;
        color: #334155;
        opacity: .85;
      }

      .file {
        display: grid;
        place-items: center;
        font-size: .85rem;
        user-select: none;
      }
    </style>
  </head>

  <body>
    <div class="app">

      <div class="brand-header-kids">
        <div class="brand-row">
          <div class="kids-badge">♙</div>
          <div>
            <div class="kids-title">Academia de Ajedrez Mauro</div>
            <div class="kids-subtitle">
              <span class="kids-pill" onclick="location.href='index.html'">Inicio</span>
              <span class="kids-pill" onclick="location.href='ruta-chess.html'">Ruta de aprendizaje</span>
            </div>
          </div>
        </div>
      </div>

      <h1>El peón al paso</h1>
      <p class="subtitle">Observa el avance y captura correctamente</p>

      <div class="status-bar">
        <div>✅ <b id="ok">0</b></div>
        <div>❌ <b id="bad">0</b></div>
        <div>📊 <b id="prog">0</b>/10</div>
      </div>

      <div class="progress">
        <div class="progress-inner" id="bar"></div>
      </div>

      <div class="card">
        <div class="board-wrap">
          <div class="board-grid">
            <!-- Filas -->
            <div class="ranks" id="ranks"></div>

            <!-- Tablero -->
            <div class="board" id="board"></div>

            <!-- Espacio vacío -->
            <div></div>

            <!-- Columnas -->
            <div class="files" id="files"></div>
          </div>
        </div>

        <div class="feedback" id="feedback"></div>
      </div>

      <div class="controls">
        <button class="main-btn" onclick="repeatVoice()">🔊 Repetir</button>
        <button class="main-btn" onclick="next()">Siguiente</button>
        <button class="main-btn" onclick="shareApp()">📤 Compartir</button>

        <button class="main-btn" id="nextTopicBtn" style="display:none;background:#16a34a"
          onclick="goNextTopic()">Siguiente tema</button>
      </div>


    </div>

    <script>
      const files = ["a", "b", "c", "d", "e", "f", "g", "h"];
      const TOTAL = 10;

      let ok = 0, bad = 0, attempts = 0;
      let whitePawn = "", blackFrom = "", blackTo = "", enPassant = "";
      let ready = false, lastSpeech = "";

      const okEl = document.getElementById("ok");
      const badEl = document.getElementById("bad");
      const progEl = document.getElementById("prog");
      const bar = document.getElementById("bar");
      const feedback = document.getElementById("feedback");
      const board = document.getElementById("board");

      function speak(t) {
        lastSpeech = t;
        const u = new SpeechSynthesisUtterance(t);
        u.lang = "es-PE";
        u.rate = .9;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      }

      function repeatVoice() {
        if (lastSpeech) speak(lastSpeech);
      }

      function idx(c) {
        return files.indexOf(c[0]) + (8 - parseInt(c[1])) * 8;
      }

      function buildBoard() {
        board.innerHTML = "";
        for (let r = 8; r >= 1; r--) {
          for (let f = 0; f < 8; f++) {
            const sq = document.createElement("div");
            sq.className = "sq " + (((f + r) % 2) ? "dark" : "light");
            const coord = files[f] + r;
            sq.dataset.c = coord;
            sq.onclick = () => check(coord, sq);
            board.appendChild(sq);
          }
        }
      }

      function clearMarks() {
        document.querySelectorAll(".sq").forEach(s => {
          s.classList.remove("path", "target", "wrong", "hint");
        });
      }

      function setupPosition() {
        ready = false;
        clearMarks();
        buildBoard();
        buildBorders();


        const baseFile = Math.floor(Math.random() * 6) + 1;
        const fWhite = files[baseFile];
        const fBlack = files[baseFile + 1];

        whitePawn = fWhite + "5";
        blackFrom = fBlack + "7";
        blackTo = fBlack + "5";
        enPassant = fBlack + "6";

        board.children[idx(whitePawn)].innerHTML =
          "<span style='color:#0f172a; text-shadow:0 1px 2px rgba(0,0,0,.35)'>♙</span>";

        board.children[idx(blackFrom)].innerHTML =
          "<span style='color:#020617; text-shadow:0 1px 2px rgba(255,255,255,.35)'>♟</span>";


        speak(
          "Observa con atención. El peón negro avanza dos casillas desde su posición inicial."
        );

        setTimeout(() => {
          board.children[idx(blackFrom)].textContent = "";
          board.children[idx(blackFrom)].classList.add("path");

          board.children[idx(blackTo)].textContent = "♟";
          board.children[idx(blackTo)].classList.add("path");

          setTimeout(() => {
            clearMarks();
            board.children[idx(enPassant)].classList.add("hint");
            ready = true;

            speak(
              "Como el peón negro avanzó dos casillas y pasó junto al peón blanco, " +
              "el peón blanco puede capturar al paso en esta casilla."
            );
          }, 700);

        }, 800);
      }

      function check(coord, el) {
        if (!ready || attempts >= TOTAL) return;

        clearMarks();

        if (coord === enPassant) {
          ok++;
          attempts++;
          ready = false;


          // 🟩 casilla correcta
          el.classList.add("target");

          // 🧠 CAPTURA AL PASO REAL
          const whiteFromIdx = idx(whitePawn);
          const blackPawnIdx = idx(blackTo);
          const targetIdx = idx(enPassant);

          // quitar peón negro capturado
          board.children[blackPawnIdx].textContent = "";

          // mover peón blanco
          board.children[whiteFromIdx].textContent = "";
          board.children[targetIdx].innerHTML =
            "<span style='color:#0f172a; text-shadow:0 1px 2px rgba(0,0,0,.35)'>♙</span>";


          // actualizar referencia del peón blanco
          whitePawn = enPassant;

          feedback.textContent = "¡Correcto! El peón captura al paso.";
          speak(
            "Correcto. El peón blanco captura al paso y el peón negro es retirado del tablero."
          );
        }
        else {
          bad++;   // ❌ solo cuenta el error
          // NO incrementa attempts
          // NO bloquea el intento

          el.classList.add("wrong");
          feedback.textContent = "Intenta otra vez. Observa la casilla marcada.";
          board.children[idx(enPassant)].classList.add("hint");

          speak(
            "No es correcto. Observa con atención y vuelve a intentar."
          );

          // actualizar solo el contador de errores
          badEl.textContent = bad;
        }


        updateStatus();

        if (attempts >= TOTAL) {
          finish();
        }
      }

      function updateStatus() {
        okEl.textContent = ok;
        badEl.textContent = bad;
        progEl.textContent = attempts;
        bar.style.width = (attempts / TOTAL * 100) + "%";
      }

      function next() {
        if (attempts < TOTAL) {
          feedback.textContent = "";
          setupPosition();
        }
      }

      function finish() {
        feedback.textContent =
          "🎉 ¡Excelente! Recuerda: el peón al paso solo se puede capturar inmediatamente.";

        speak(
          "Excelente. Has aprendido la regla especial del peón al paso."
        );
        document.getElementById("nextTopicBtn").style.display = "inline-block";
      }

      function goNextTopic() {
        location.href = "ajedrez-10.html";
      }

      setupPosition();

      function shareApp() {
        const data = {
          title: "Academia de Ajedrez Mauro",
          text: "Clase: Peón al paso ♟️",
          url: location.href
        };

        if (navigator.share) {
          navigator.share(data);
        } else {
          navigator.clipboard.writeText(data.url);
          alert("Link copiado");
        }
      }

      function buildBorders() {
        const ranksEl = document.getElementById("ranks");
        const filesEl = document.getElementById("files");

        if (!ranksEl || !filesEl) return;

        ranksEl.innerHTML = "";
        filesEl.innerHTML = "";

        // Filas 8 → 1
        for (let r = 8; r >= 1; r--) {
          const d = document.createElement("div");
          d.className = "rank";
          d.textContent = r;
          ranksEl.appendChild(d);
        }

        // Columnas a → h
        for (let f = 0; f < files.length; f++) {
          const d = document.createElement("div");
          d.className = "file";
          d.textContent = files[f];
          filesEl.appendChild(d);
        }
      }


    </script>




  </body>

</html>
